name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install tools
        run: |
          brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        run: |
          xcodebuild archive \
            -project TransFleetPro.xcodeproj \
            -scheme TransFleetPro \
            -configuration Release \
            -archivePath build/TransFleetPro.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Copy .app from archive
        run: |
          cp -R build/TransFleetPro.xcarchive/Products/Applications/TransFleetPro.app build/TransFleetPro.app

      - name: Create DMG
        run: |
          create-dmg \
            --volname "TransFleet Pro" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 170 \
            "build/TransFleetPro-${GITHUB_REF_NAME}.dmg" \
            "build/TransFleetPro.app"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/TransFleetPro-${{ github.ref_name }}.dmg
